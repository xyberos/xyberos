site_name: Xyberos
site_description: An experimental cognitive framework for building AI systems
site_author: Xyberos Contributors
repo_url: https://github.com/xyberos/xyberos
repo_name: xyberos/xyberos
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

extra:
  version:
    provider: mike

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

plugins:
  - search

nav:
  - Home: index.md
  - Learn:
      - What is Xyberos?: learn/01-what-is-xyberos.md
      - Getting Started: learn/02-getting-started.md
      - Hello Assistant: learn/03-hello-assistant.md
      - Give It a Name & Personality: learn/04-name-and-personality.md
      - Give It Knowledge: learn/05-knowledge.md
      - Give It Memory: learn/06-memory.md
      - Give It Skills — Tools: learn/07-tools.md
      - Give It Plans & Workflows: learn/08-workflows.md
      - Skills & Plugins: learn/09-plugins.md
      - Give It a Brain: learn/10-brain.md
      - Context: learn/11-context.md
      - Multi-Agent Systems: learn/12-agents.md
      - Configuration: learn/13-configuration.md
      - Observability & Debugging: learn/14-observability.md
      - Security: learn/15-security.md
      - Testing: learn/16-testing.md
      - Build Your First Jarvis: learn/17-build-your-jarvis.md
      - Configuring Services: learn/18-configuring-services.md
      - Extension Surfaces: learn/19-extension-surfaces.md
      - Lifecycle & Services: learn/20-lifecycle.md
      - Knowledge Ingestion: learn/21-knowledge-ingestion.md
      - Training Xyberos: learn/22-training-tutorial.md
      - Build a Customer Support Assistant: learn/23-customer-support-tutorial.md
      - Build & Contribute Plugins: learn/24-plugin-development.md
  - How-To: howto.md
