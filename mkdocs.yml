site_name: Xyberos
site_description: An experimental cognitive framework for building AI systems
site_author: Xyberos Contributors
repo_url: https://github.com/xyberos/xyberos
repo_name: xyberos/xyberos
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

extra:
  version:
    provider: mike

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

plugins:
  - search

nav:
  - Home: README.md
  - Tutorial: tutorial.md
  - Guides:
      - Configuring Services: configuring-services.md
      - Extension Surfaces: extensions.md
      - Lifecycle & Services: lifecycle.md
  - API Reference: api-reference.md
  - Roadmap: RFCs/RFC-Roadmap.md
  - Architecture RFCs:
      - RFC-0001 Architecture: RFCs/RFC-0001-architecture.md
      - RFC-0002 Kernel: RFCs/RFC-0002-kernel.md
      - RFC-0003 Runtime: RFCs/RFC-0003-runtime.md
      - RFC-0004 Brain: RFCs/RFC-0004-brain.md
      - RFC-0005 Context: RFCs/RFC-0005-context.md
      - RFC-0006 LLM Provider: RFCs/RFC-0006-llm-provider.md
      - RFC-0007 Memory: RFCs/RFC-0007-memory.md
      - RFC-0008 Knowledge: RFCs/RFC-0008-knowledge.md
      - RFC-0009 Planner: RFCs/RFC-0009-planner.md
      - RFC-0010 Tools: RFCs/RFC-0010-tools.md
      - RFC-0011 Workflows: RFCs/RFC-0011-workflows.md
      - RFC-0012 Agents: RFCs/RFC-0012-agents.md
      - RFC-0013 Plugins: RFCs/RFC-0013-plugins.md
      - RFC-0014 Events: RFCs/RFC-0014-events.md
      - RFC-0015 Security: RFCs/RFC-0015-security.md
      - RFC-0016 Trainable Cognitive Engines: RFCs/RFC-0016-trainable-cognitive-engines.md
