name: 'Xyberos Plugin Validator'
description: >-
  Validate a Xyberos plugin package on every PR (structure, contract,
  configuration, testing, documentation, and live-kernel compatibility).
  Institutionalizes the EXTRA.md contribution pipeline.
inputs:
  path:
    description: 'Plugin package directory to validate.'
    required: false
    default: '.'
  run-tests:
    description: 'Also run the plugin''s test suite with pytest.'
    required: false
    default: 'false'
runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install xyberos-cli
      shell: bash
      run: python -m pip install --upgrade pip && python -m pip install xyberos-cli

    - name: Validate plugin
      shell: bash
      run: |
        if [ "${{ inputs.run-tests }}" = "true" ]; then
          xyberos plugin validate "${{ inputs.path }}" --run-tests
        else
          xyberos plugin validate "${{ inputs.path }}"
        fi
