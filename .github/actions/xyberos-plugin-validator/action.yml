# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
name: 'Xyberos Plugin Validator'
description: >-
  Validate a Xyberos plugin package on every PR (structure, contract,
  configuration, testing, documentation, and live-kernel compatibility).
  Institutionalizes the plugin-contribution.md contribution pipeline.
inputs:
  path:
    description: 'Plugin package directory to validate.'
    required: false
    default: '.'
  run-tests:
    description: 'Also run the plugin''s test suite with pytest.'
    required: false
    default: 'false'
runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install xyberos tooling
      shell: bash
      run: |
        python -m pip install --upgrade pip
        # The plugin tooling packages (sdk / validator / cli) are not published to
        # PyPI yet, so install them from the repo checkout (this action is expected
        # to live in the xyberos monorepo where they live at the repo root).
        python -m pip install ./ ./xyberos_plugin_sdk ./xyberos_plugin_validator ./xyberos_cli
        if [ "${{ inputs.run-tests }}" = "true" ]; then
          python -m pip install pytest
        fi

    - name: Validate plugin
      shell: bash
      run: |
        if [ "${{ inputs.run-tests }}" = "true" ]; then
          xyberos plugin validate "${{ inputs.path }}" --run-tests
        else
          xyberos plugin validate "${{ inputs.path }}"
        fi
