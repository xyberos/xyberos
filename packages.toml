# The distributions this line knows about outside this repository.
#
# This file is the single source for a name, its import root, the core range it declares, and whether it
# is published yet. The plugin guide's catalogue, the feature matrix, and the release guide are checked
# against it by `tests/test_packages_manifest.py`, so a renamed package, a forgotten pointer, or a
# package that quietly acquired a dependency it was not supposed to have is a failing test rather than a
# reader's discovery.
#
# Two rules from ADR 0018 are enforced by that test rather than stated here:
#
#   * `import_root` is the package's own top-level module, never a path inside `xyberos.*`. Two
#     distributions owning paths under `xyberos/` would make a partial install a half-existing directory
#     and an uninstall a stale one, and it would disarm the import-boundary tests.
#   * every name this line publishes begins with `xyberos-`, so the retirements and the reuses stay
#     recognizable as this project's own.
#
# `status` is one of five values, and nothing is implied by their absence:
#
#   * `placeholder` - the name is claimed on the index with a pre-release, and no work has started.
#   * `planned`     - the capability is decided and no distribution is written yet.
#   * `written`     - the distribution exists in the ecosystem repository and this line has no release of
#                     it, so nothing is installable under the name from this line yet. A reused name may
#                     already carry a 1.x release on the index; that release is the other line's code,
#                     which is why `written` does not say `published`.
#   * `published`   - a release of this line's content exists, so the compatibility job installs and
#                     exercises it.
#   * `retired`     - the name is answered by this line instead, and the published 1.x release gains a
#                     pointer to what replaced it. `retired` is the decision: the pointer patch is an
#                     upload, and nothing here claims one has landed.
#
# A `published` entry also declares `conformance`: Python source the compatibility job runs with
# `python -c`, which exits non-zero when a check fails. There are two kinds, and which one an entry uses is
# decided by whether this line ships a suite for the seam the package implements:
#
#   * A **provider** of a seam this repository ships a suite for runs that suite, because the suite is the
#     contract and it is what the package's own CI runs too. The shape is
#     `import sys; from <module>.conformance import main; sys.exit(main())` — it has to exit *with* the
#     callable's status, because `from x import main; main()` discards the return value and reports success
#     on a failed check. The package imports the suite from the installed core and owns whatever setup its
#     backend needs, so the snippet stays short.
#   * A package that implements **no** such seam proves what can be proved from outside it: that its public
#     names import against the core it declares, and that the installed core meets the floor it declares. The
#     shape is `import xyberos; from <root> import <public names>; assert tuple(int(part) for part in
#     xyberos.__version__.split('.')[:2]) >= (2, <minor>)`. Checking the floor rather than only the major is
#     deliberate: a declared range is not a proof, because `>=2,<3` is satisfied by `2.0.0` and a package that
#     imports a module added in `2.1.0` breaks on it with no version conflict to warn anyone.
#
# An entry may declare its target before its release exists, because the target is what the release waits on.
# The job refuses to install a published package that does not declare one, because a package that is
# installed and not checked is worse than one that is not installed at all.

schema_version = 1

# What every package beside this line must declare. A package that needs a newer core is a bug rather
# than a compatibility note, because this line's minor releases add names and never remove them.
core_requirement = "xyberos>=2,<3"

[[package]]
name = "xyberos-mcp"
import_root = "xyberos_mcp"
status = "published"
summary = "The server direction: exposing an application's tools over MCP; a stdio transport only with the owner's approval"
dependencies = ["xyberos[http]>=2.1,<3"]
conformance = "import xyberos; from xyberos_mcp import McpServer, expose; assert tuple(int(part) for part in xyberos.__version__.split('.')[:2]) >= (2, 1), xyberos.__version__; print('xyberos-mcp: ok against', xyberos.__version__)"
rationale = "expose() needs an HTTP surface, and stdio spawns a process. The shipped client refuses both on purpose."

[[package]]
name = "xyberos-templates"
import_root = "xyberos_templates"
status = "published"
summary = "Server-rendered pages: an engine-neutral Templates contract with Jinja2 shipped, a static mount, and form reading"
dependencies = ["xyberos[http]>=2,<3", "jinja2>=3.1,<4", "python-multipart>=0.0.18,<1"]
conformance = "import xyberos; from xyberos_templates import Jinja2Templates, Templates, TemplatesSettings; assert tuple(int(part) for part in xyberos.__version__.split('.')[:2]) >= (2, 0), xyberos.__version__; print('xyberos-templates: ok against', xyberos.__version__)"
rationale = "It needs Jinja2, which pyproject.toml records as an application's dependency rather than this line's, and a static mount and form reading need the HTTP extra's Starlette."

[[package]]
name = "xyberos-observability"
import_root = "xyberos_observability"
status = "published"
summary = "One explicit call that configures a logging handler and spans, fed by the runtime's own event sink"
dependencies = ["xyberos[http]>=2,<3", "opentelemetry-api>=1.20,<2", "opentelemetry-sdk>=1.20,<2"]
conformance = "import xyberos; from xyberos_observability import Observability, ObservabilitySettings, RequestSpanMiddleware; assert tuple(int(part) for part in xyberos.__version__.split('.')[:2]) >= (2, 0), xyberos.__version__; print('xyberos-observability: ok against', xyberos.__version__)"
rationale = "It needs OpenTelemetry, and the runtime configures no handler by decision."

[[package]]
name = "xyberos-auth"
import_root = "xyberos_auth"
status = "published"
summary = "Verification only: an assertion from a shared secret or a JWKS, and a Principal"
dependencies = ["cryptography>=42,<47"]
conformance = "import xyberos; from xyberos_auth import AuthSettings, Principal, PrincipalVerifier; assert tuple(int(part) for part in xyberos.__version__.split('.')[:2]) >= (2, 0), xyberos.__version__; print('xyberos-auth: ok against', xyberos.__version__)"
rationale = "Real assertions are asymmetric. The policy half stays absent from the framework (ADR 0014)."

[[package]]
name = "xyberos-postgres"
import_root = "xyberos_postgres"
status = "published"
summary = "A DatabaseProvider for PostgreSQL, proved against the shipped conformance suite"
dependencies = ["xyberos[database]>=2,<3", "asyncpg>=0.29,<1", "sqlalchemy>=2.0,<2.1"]
conformance = "import sys; from xyberos_postgres.conformance import main; sys.exit(main())"
rationale = "It needs a driver core will not adopt, and it answers the two SQLite-specific promises the provider guide names or refuses loudly."

[[package]]
name = "xyberos-storage-s3"
import_root = "xyberos_storage_s3"
status = "published"
summary = "A Storage provider for S3-compatible object stores, proved against the shipped conformance suite"
dependencies = ["xyberos>=2.1,<3", "aioboto3>=13,<16"]
conformance = "import sys; from xyberos_storage_s3.conformance import main; sys.exit(main())"
rationale = "It needs an object-store client core will not adopt."

[[package]]
name = "xyberos-openai-compatible"
import_root = "xyberos_openai_compatible"
status = "published"
summary = "A ModelProvider for OpenAI-compatible chat and embedding endpoints"
dependencies = ["xyberos>=2.1,<3", "httpx>=0.27,<1"]
conformance = "import sys; from xyberos_openai_compatible.conformance import main; sys.exit(main())"
rationale = "A second backend for a facade whose first is Ollama (ADR 0004); promoting it to an extra would amend that ADR."

[[package]]
name = "xyberos-crud"
import_root = "xyberos_crud"
status = "published"
summary = "Query construction over the provider contract: filtering, sorting, and pagination as values rather than entities"
dependencies = ["xyberos[database]>=2,<3", "sqlalchemy>=2.0,<2.1"]
conformance = "import xyberos; from xyberos_crud import CrudSettings, Query, apply_query, fetch_page; assert tuple(int(part) for part in xyberos.__version__.split('.')[:2]) >= (2, 0), xyberos.__version__; print('xyberos-crud: ok against', xyberos.__version__)"
rationale = "The filter operators and the pagination style are policy, which is why ADR 0023 places it beside this line rather than in core. It reached the first release of this line, so its floor is that release rather than a later one: the whole suite passes against core 2.0.0."

[[package]]
name = "xyberos-memory"
import_root = "xyberos_memory"
status = "written"
summary = "Persistent conversation history and explicitly scoped facts over DatabaseProvider"
dependencies = ["xyberos[database]>=2,<3"]
conformance = "import sys; from xyberos_memory.conformance import main; sys.exit(main())"
rationale = "Conversation persistence and fact semantics are application capabilities, while DatabaseProvider leaves the backend choice with the application."

[[package]]
name = "xyberos-knowledge"
import_root = "xyberos_knowledge"
status = "written"
summary = "Document chunking, embedding, retrieval, and citations over an application-supplied vector store"
dependencies = ["xyberos>=2,<3"]
conformance = "import xyberos; from xyberos_knowledge import KnowledgeIndex, VectorStore; assert tuple(int(part) for part in xyberos.__version__.split('.')[:2]) >= (2, 0), xyberos.__version__; print('xyberos-knowledge: ok against', xyberos.__version__)"
rationale = "Retrieval composes the core EmbeddingModel contract with a package-owned VectorStore protocol; storage adapters and prompt policy remain separate."

[[package]]
name = "xyberos-db"
import_root = "xyberos_db"
status = "retired"
summary = "Retired: the capability is xyberos[database] and the provider seam"
dependencies = []
replaced_by = "xyberos[database]"
rationale = "A metadata-only pointer patch keeps the <2 pin, so nothing moves under a 1.x user. The patch is an upload, and it has not landed yet."

[[package]]
name = "xyberos-metrics"
import_root = "xyberos_metrics"
status = "retired"
summary = "Retired: request metrics ship as xyberos.http.RequestMetricsMiddleware"
dependencies = []
replaced_by = "xyberos.http"
rationale = "The capability is here now, so a 2.x release under the old name would be a second answer; no release under this name resolves on the index, so there is no pointer patch to publish either."
