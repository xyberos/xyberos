[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "xyberos-plugin-sdk"
version = "0.1.0"
description = "Typed plugin base classes, declarative loader, and contract introspection for the Xyberos platform."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Xyberos Contributors"}]
keywords = ["xyberos", "ai", "plugin", "sdk", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]
dependencies = ["xyberos>=1.0"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
package-dir = {"xyberos_plugin_sdk" = "."}
packages = ["xyberos_plugin_sdk"]
