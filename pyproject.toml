[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "xyberos"
description = "A continuously evolving, layered platform for building AI applications. Its architecture is designed to support capabilities including agents, tools, workflows, multi-agent collaboration, streaming, memory, knowledge, planning, trainable intent and learning engines, plugins, observability, and security as the platform develops."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dynamic = ["version"]
authors = [
    {name = "Baltazar G. de Chavez Jr."},
]
keywords = [
    "ai",
    "agent",
    "cognitive",
    "llm",
    "multi-agent",
    "observability",
    "platform",
    "plugin",
    "security",
    "streaming",
    "tools",
    "workflow",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://docs.xyberos.com"
Documentation = "https://docs.xyberos.com"
Repository = "https://github.com/xyberos/xyberos"
Issues = "https://github.com/xyberos/xyberos/issues"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
]
train = [
    "scikit-learn",
    "joblib",
]
vectors = [
    "chromadb",
    "pgvector",
    "psycopg[binary]",
    "qdrant-client",
    "faiss-cpu",
]
rerank = [
    "scikit-learn",
]
embeddings = [
    "sentence-transformers",
]
documents = [
    "pypdf",
    "python-docx",
    "openpyxl",
]
state = [
    "redis",
]
mcp = [
    "mcp",
]
llm-providers = [
    "boto3",
    "google-auth",
]

[tool.setuptools.packages.find]
# Only the core package (and its subpackages) ship in the `xyberos` wheel.
# The plugin tooling packages (xyberos_plugin_sdk / _validator / _cli) are
# external, independent distributions and must NOT be bundled here.
include = ["xyberos", "xyberos.*"]

[tool.setuptools.dynamic]
version = {attr = "xyberos.version.__version__"}

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
