[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "xyberos"
version = "2.2.0"
description = "Composable Python application runtime"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Xyberos contributors" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
keywords = [
  "async",
  "dependency injection",
  "framework",
  "plugins",
  "python",
  "sqlite",
  "starlette",
  "workflow",
]
dependencies = [
  "tomli>=2,<3; python_version < '3.11'",
]

[project.scripts]
xyberos = "xyberos.cli.main:main"

[project.urls]
Documentation = "https://docs.xyberos.com/"
Repository = "https://github.com/xyberos/xyberos"
Issues = "https://github.com/xyberos/xyberos/issues"

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "hatchling>=1.25,<2",
  "httpx>=0.27,<1",
  # The Traditional Apps path's interface lessons render templates, and Xyberos does not ship a
  # template engine: Jinja2 belongs to the application, so it is a development dependency here rather
  # than an extra on the package.
  "jinja2>=3.1,<4",
  "mkdocs-material>=9.5,<10",
  "mypy>=1.11,<2",
  # The two checks CI runs first are also a git hook, so the loop starts before the build does. The
  # hook and the workflow install ruff from the same range below, which is what keeps them agreeing.
  "pre-commit>=3.7,<5",
  # The interface lessons read a submitted form, and Starlette's form parsing needs this library to
  # be installed at all: without it `request.form()` asserts rather than parsing. An application that
  # reads forms needs it; Xyberos does not read one, so it belongs here for the same reason Jinja2
  # does.
  "python-multipart>=0.0.18,<1",
  "pytest>=8,<10",
  "ruff>=0.6,<1",
  "tomli>=2,<3",
  "types-PyYAML>=6.0,<7",
]
http = [
  "httpx>=0.27,<1",
  "starlette>=0.40,<2",
]
database = [
  "aiosqlite>=0.20,<1",
  "alembic>=1.13,<2",
  "sqlalchemy>=2.0,<2.1",
]
ollama = ["httpx>=0.27,<1"]
durable = [
  "aiosqlite>=0.20,<1",
  "alembic>=1.13,<2",
  "sqlalchemy>=2.0,<2.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/xyberos"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src", "examples", "tests/fixtures/metrics_plugin", "tools"]
testpaths = ["tests"]
# The durable package warns on purpose once per process, and the behavior is asserted explicitly in
# tests/durable/test_journal.py, so the suite does not need to print it again.
filterwarnings = ["ignore::xyberos.errors.ExperimentalWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
files = [
  "src",
  "tools",
  "examples/broker_worker/app.py",
  "examples/durable_workflow/app.py",
  "examples/hello_app/app.py",
  "examples/learn_ai",
  "examples/learn_extend",
  "examples/learn_fundamentals",
  "examples/learn_hybrid",
  "examples/learn_production",
  "examples/learn_traditional",
  "examples/support_desk",
  "examples/tenancy/app.py",
  "examples/tutorial",
  "examples/user_management",
  "site/scripts",
  "tests/contracts/examples/phase1_minimal_app.py",
  "tests/contracts/examples/phase4_workflow.py",
  "tests/site",
]
# The site's scripts import each other by bare name, the way `python site/scripts/build.py` runs them.
mypy_path = "site/scripts"
python_version = "3.10"
strict = true
warn_unused_configs = true
