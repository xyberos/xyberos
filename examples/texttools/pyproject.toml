[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "texttools"
version = "0.1.0"
description = "Text utility tools (count words, slugify, echo) for agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = ["xyberos>=1.0", "xyberos-plugin-sdk>=0.1"]

[project.entry-points."xyberos.plugins"]
texttools = "texttools.plugin:plugin"

[tool.setuptools]
packages = ["texttools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
